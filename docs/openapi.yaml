openapi: 3.1.0
info:
  title: Next.js Go SaaS Billing Kit API
  version: 0.1.0
  description: |
    OpenAPI contract for the starter Go API used by the frontend app.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Billing
paths:
  /api/v1/workspaces:
    get:
      tags: [Billing]
      operationId: listWorkspaces
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Accessible workspaces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
  /api/v1/workspaces/{workspaceID}/billing:
    parameters:
      - in: path
        name: workspaceID
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Billing]
      operationId: getBillingSummary
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Subscription, entitlement, and usage summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSummary" }
  /api/v1/workspaces/{workspaceID}/billing/checkout:
    parameters:
      - in: path
        name: workspaceID
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Billing]
      operationId: createCheckoutSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price_id]
              properties: { price_id: { type: string } }
      responses:
        "201":
          description: Hosted checkout URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionURL" }
  /api/v1/workspaces/{workspaceID}/billing/portal:
    parameters:
      - in: path
        name: workspaceID
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Billing]
      operationId: createCustomerPortalSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_url]
              properties: { return_url: { type: string, format: uri } }
      responses:
        "201":
          description: Hosted portal URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionURL" }
  /api/v1/billing/webhooks/stripe:
    post:
      tags: [Billing]
      operationId: processStripeWebhook
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema: { type: string }
      responses:
        "200": { description: Signed event processed or already seen }
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Get API health status
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Auth session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "204":
          description: Password reset accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset a password with a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: Password updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify an email address with a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "204":
          description: Email verified
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerificationEmail
      summary: Resend email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationInput"
      responses:
        "204":
          description: Verification email requested
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the currently authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed or is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict with existing data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: Feature not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream integration failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Workspace:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
    Subscription:
      type: object
      required: [workspace_id, provider, plan, status, cancel_at_period_end, updated_at]
      properties:
        workspace_id: { type: string, format: uuid }
        provider: { type: string }
        provider_customer_id: { type: string }
        provider_subscription_id: { type: string }
        plan: { type: string, enum: [free, pro, team] }
        status: { type: string, enum: [trialing, active, past_due, canceled] }
        current_period_end: { type: string, format: date-time }
        grace_period_end: { type: string, format: date-time }
        cancel_at_period_end: { type: boolean }
        updated_at: { type: string, format: date-time }
    BillingSummary:
      type: object
      required: [workspace, membership_role, subscription, entitlements, usage]
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        membership_role: { type: string, enum: [owner, admin, member] }
        subscription: { $ref: "#/components/schemas/Subscription" }
        entitlements:
          type: object
          additionalProperties: { type: integer, format: int64 }
        usage:
          type: object
          additionalProperties: { type: integer, format: int64 }
    SessionURL:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required: [name, env, version, database, timestamp]
      properties:
        name:
          type: string
        env:
          type: string
        version:
          type: string
        database:
          type: string
        timestamp:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - email
        - role
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
        status:
          type: string
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RegisterInput:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        full_name:
          type: string
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ForgotPasswordInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordInput:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    VerifyEmailInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    ResendVerificationInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    UserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"
    AuthResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    RegisterResponse:
      type: object
      additionalProperties: false
      required: [message, user]
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/User"
